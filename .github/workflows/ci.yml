name: MoonDBC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  moonbit:
    name: MoonBit core, CLI, and fixture integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.25
        with:
          version: "0.1.20260920"
          setup-core: true
          core-version: "0.10.14+7d59c7ec9"
      - name: Show toolchain
        run: moon version --all
      - name: Format check
        run: moon fmt --check
      - name: Type check
        run: moon check
      - name: Unit tests
        run: moon test
      - name: Build CLI
        run: moon build cmd/moondbc --target native
      - name: File-level CLI integration
        run: moon run scripts/integration_test.mbtx
      - name: Validate primary fixtures
        run: |
          moon run cmd/moondbc -- validate testdata/minimal.dbc
          moon run cmd/moondbc -- validate testdata/common_header.dbc
      - name: Run examples
        run: |
          moon run examples/api_demo
          moon run cmd/moondbc -- inspect testdata/common_header.dbc
          moon run cmd/moondbc -- decode testdata/minimal.dbc --frame-id 256 --data A0BC
          moon run cmd/moondbc -- encode testdata/minimal.dbc --message Minimal --signal IntelValue=3018 --signal Mode=2

  cantools:
    name: Optional independent cantools comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.25
        with:
          version: "0.1.20260920"
          setup-core: true
          core-version: "0.10.14+7d59c7ec9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - name: Install development-only reference tool
        run: python -m pip install -r requirements-dev.txt
      - name: Compare golden vectors
        run: python scripts/cantools_compare.py
